baseURL = "https://hakuya1102.github.io/"
languageCode = "en-us"
title = "はくやのひみつきち"
theme = "blowfish"
mainSections = ["posts","instructions","learning"]
enableSearch = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  tag = "tags"

[params.author]
  name = "はくや"
  email = "hakuya1102@gmail.com"
  image = "img/hiro3.jpg"
  imageQuality = 100
  # headline = ""
  bio = "A little bit about you"
  links = [
    { email = "mailto:hakuya1102@gmail.com" },
  ]

[params.homepage]
  layout = "hero"       # try "page" or "card" for a blog-like layout
  showRecent = true     # show recent posts
  showRecentItems = 5   # how many posts to show
  showMoreLink = true   # show "More" link at bottom
  showMoreLinkDest = "/posts/"
  # homepageImage = "img/hiro_2.jpg"
  homepageImage = "img/fireflies.svg"
  cardView = true # 将列表展示为卡片容器。
  # disableHeroImageFilter = true

[params.style]
  rounded = true

[menu]

  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "Instructions"
    url = "/instructions/"
    weight = 3

  [[menu.main]]
    name = "Learning"
    identifier = "learning"
    url = "/learning/"
    weight = 4

  [[menu.main]]
    name = "A"
    url = "/learning/a/"
    parent = "learning"
    weight = 1

  [[menu.main]]
